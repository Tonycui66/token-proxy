<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token 用量监控</title>
<style>
  /* ==== 调色板（已通过 validate_palette.js 明暗双模式验证）==== */
  .viz-root {
    color-scheme: light;
    --page: #f9f9f7; --surface-1: #fcfcfb;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --other: #b5b3ac; --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --page: #0d0d0d; --surface-1: #1a1a19;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --other: #5a5954; --accent: #3987e5;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --other: #5a5954; --accent: #3987e5;
  }

  * { box-sizing: border-box; }
  body.viz-root {
    margin: 0; background: var(--page); color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 24px; max-width: 1080px; margin-inline: auto;
  }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  button.theme-toggle {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 8px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  .nav-tabs { display: flex; gap: 4px; margin-left: 8px; }
  .nav-tabs button {
    border: none; background: none; color: var(--text-secondary);
    padding: 4px 12px; font-size: 14px; cursor: pointer; border-radius: 8px;
  }
  .nav-tabs button:hover { background: color-mix(in srgb, var(--text-primary) 6%, var(--surface-1)); }
  .nav-tabs button.active { color: var(--text-primary); font-weight: 600;
    background: color-mix(in srgb, var(--text-primary) 8%, var(--surface-1)); }

  .status-list { display: flex; flex-direction: column; gap: 8px; }
  .status-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.ok { background: #0ca30c; }
  .dot.bad { background: #d03b3b; }
  .status-item .hint { color: var(--muted); font-size: 12px; }
  .setting-row { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .setting-row select, #price-table input, .actions button {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    border-radius: 8px; padding: 4px 10px; font-size: 13px;
  }
  #price-table input { width: 110px; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .actions button { cursor: pointer; }
  #price-table table td { vertical-align: middle; }

  /* 筛选行：一行，位于所有图表之上 */
  .filters { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  .filters button {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer;
  }
  .filters button:hover { background: color-mix(in srgb, var(--text-primary) 6%, var(--surface-1)); }
  .filters button.active {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 0 0 12px; }

  /* KPI 行 */
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
  .tile .label { font-size: 12px; color: var(--text-secondary); }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .tile .note  { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } }

  svg text { font: 11px system-ui, "Segoe UI", sans-serif; fill: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 12px; height: 12px; border-radius: 3px; }
  .legend .linekey { width: 14px; height: 2px; border-radius: 1px; }

  /* 表格视图（也是浅色低对比系列的 relief 通道） */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-secondary); font-weight: 600; font-size: 12px;
       border-bottom: 1px solid var(--grid); padding: 6px 8px; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--grid); color: var(--text-primary);
       font-variant-numeric: tabular-nums; }
  td.num, th.num { text-align: right; }
  tr:last-child td { border-bottom: none; }
  .swatch-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: baseline; }

  /* 提示框 */
  #tooltip {
    position: fixed; pointer-events: none; display: none; z-index: 10;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15); padding: 8px 10px; font-size: 12px; min-width: 150px;
  }
  #tooltip .tt-title { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  #tooltip .tt-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  #tooltip .tt-key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
  #tooltip .tt-val { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  #tooltip .tt-name { color: var(--text-secondary); }

  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
  .stale-note { font-size: 11px; color: var(--muted); }

  /* ==== Key 管理（面向普通用户的卡片视图）==== */
  .keys-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .keys-toolbar .primary {
    background: var(--accent); border: none; color: #fff; font-weight: 600;
    border-radius: 8px; padding: 8px 20px; font-size: 14px; cursor: pointer;
  }
  .keys-toolbar .note { color: var(--muted); font-size: 12px; }
  .key-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .key-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .key-card .k-top { display: flex; align-items: center; gap: 8px; }
  .key-card .k-name { font-size: 15px; font-weight: 600; flex: 1; }
  .key-card .k-token { font-family: Consolas, monospace; font-size: 12px; color: var(--text-secondary);
    background: color-mix(in srgb, var(--text-primary) 5%, transparent); border-radius: 6px; padding: 3px 8px;
    display: inline-block; margin-top: 8px; user-select: all; }
  .key-card .k-meta { font-size: 12px; color: var(--text-secondary); margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .key-card .k-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .key-card .k-foot button {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 8px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  .key-card .k-foot button.danger { color: #d03b3b; border-color: color-mix(in srgb, #d03b3b 40%, transparent); }
  .key-card .k-foot button.danger:hover { background: color-mix(in srgb, #d03b3b 10%, var(--surface-1)); }
  .state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
  .meter { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; margin-top: 8px; }
  .meter > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .meter > i.warn { background: #eda100; }
  .meter > i.over { background: #d03b3b; }

  /* 弹窗（新建 / 确认吊销 / 展示新 Key） */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex;
    align-items: center; justify-content: center; z-index: 20; }
  .modal { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 22px; width: min(460px, 92vw); max-height: 88vh; overflow: auto; }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .modal .m-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal .m-foot button { border-radius: 8px; padding: 6px 16px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); }
  .modal .m-foot button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .modal .m-foot button.danger { background: #d03b3b; border-color: #d03b3b; color: #fff; font-weight: 600; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .field input, .field select { width: 100%; border: 1px solid var(--border); background: var(--page);
    color: var(--text-primary); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .newkey-box { font-family: Consolas, monospace; font-size: 15px; padding: 12px; border-radius: 8px;
    background: color-mix(in srgb, var(--text-primary) 6%, transparent); user-select: all; word-break: break-all; }
  .warn-box { background: color-mix(in srgb, #eda100 12%, transparent); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; color: var(--text-secondary); margin-top: 12px; }

  /* ==== 登录页 ==== */
  #login-view { position: fixed; inset: 0; background: var(--page); display: flex;
    align-items: center; justify-content: center; z-index: 40; }
  .login-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px 30px; width: min(360px, 92vw); }
  .login-card h1 { font-size: 18px; margin: 0 0 4px; }
  .login-card .sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  .login-card button.primary { width: 100%; background: var(--accent); border: none; color: #fff;
    font-weight: 600; border-radius: 8px; padding: 9px 0; font-size: 14px; cursor: pointer; margin-top: 6px; }
  .login-card .err { color: #d03b3b; font-size: 12px; min-height: 16px; margin-top: 8px; }
  .user-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }
  .user-chip .role-tag { font-size: 10px; color: var(--accent); font-weight: 600; }
  .user-chip button { border: none; background: none; color: var(--muted); cursor: pointer;
    font-size: 12px; padding: 0 0 0 4px; }
  .user-chip button:hover { color: var(--text-primary); }
</style>
</head>
<body class="viz-root">
<header>
  <h1>Token 中转控制台</h1>
  <nav class="nav-tabs">
    <button id="tab-overview" class="active">概览</button>
    <button id="tab-keys">我的 Key</button>
    <button id="tab-users" style="display:none">用户管理</button>
    <button id="tab-settings" style="display:none">设置</button>
  </nav>
  <span class="sub" id="updated-at"></span>
  <span class="spacer"></span>
  <span class="user-chip" id="user-chip" style="display:none"></span>
  <button class="theme-toggle" id="theme-btn" title="切换明暗主题">主题</button>
</header>

<div id="view-overview">
  <div class="filters" id="filters">
    <button data-days="0">今天</button>
    <button data-days="7">近 7 天</button>
    <button data-days="30" class="active">近 30 天</button>
    <button data-days="90">近 90 天</button>
    <button data-days="-1">全部</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="charts">
    <div class="card">
      <h2>每日费用（USD，按模型）</h2>
      <div id="cost-line"></div>
      <div class="legend" id="cost-legend"></div>
    </div>
    <div class="card">
      <h2>请求数（按模型）</h2>
      <div id="req-bars"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>按模型汇总</h2>
    <div id="model-table"></div>
  </div>
</div>

<div id="view-settings" style="display:none">
  <div class="card">
    <h2>服务状态</h2>
    <div id="svc-status" class="status-list"></div>
  </div>

  <div class="card">
    <h2>计费单价（USD / 1M tokens）</h2>
    <p class="stale-note">单价写入 config/config.yaml（自动备份为 config.yaml.bak），
      计费规则见 docs/cost-tracking.md；修改后需重启代理生效。</p>
    <div id="price-table"></div>
    <div class="actions">
      <button class="primary" id="save-prices">保存单价</button>
      <button id="restart-proxy">重启代理使单价生效</button>
      <span id="price-msg" class="stale-note"></span>
    </div>
  </div>

  <div class="card">
    <h2>面板设置</h2>
    <div class="setting-row">
      <span>数据自动刷新</span>
      <select id="refresh-interval">
        <option value="0">关闭</option>
        <option value="10">每 10 秒</option>
        <option value="30">每 30 秒</option>
        <option value="60">每 60 秒</option>
      </select>
    </div>
  </div>
</div>

<div id="view-keys" style="display:none">
  <div class="keys-toolbar">
    <button class="primary" id="btn-new-key">＋ 新建 Key</button>
    <span class="note">把 Key 填到程序里代替上游 API Key 使用；花费自动按预算控制。</span>
  </div>
  <div class="key-grid" id="key-list"><div class="empty">加载中…</div></div>
</div>

<div id="view-users" style="display:none">
  <div class="keys-toolbar">
    <button class="primary" id="btn-new-user">＋ 新建用户</button>
    <span class="note">用户用这个账号登录本面板，只能看到和创建自己的 Key。</span>
  </div>
  <div class="card"><div id="user-table"><div class="empty">加载中…</div></div></div>
</div>

<div id="login-view" style="display:none">
  <form class="login-card" id="login-form">
    <h1>Token 中转控制台</h1>
    <div class="sub">统一管理模型调用与费用 · 本机服务</div>
    <div class="field">
      <label>用户名</label>
      <input id="login-user" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label>密码</label>
      <input id="login-pass" type="password" autocomplete="current-password">
    </div>
    <button class="primary" type="submit">登 录</button>
    <div class="err" id="login-err"></div>
  </form>
</div>

<div id="overlay" style="display:none"></div>

<div id="tooltip"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const fmtMoney = (v) => "$" + Number(v).toFixed(4);
const fmtCompact = (v) => v >= 1e6 ? (v/1e6).toFixed(1)+"M" : v >= 1000 ? (v/1000).toFixed(1)+"K" : String(Math.round(v));
const fmtInt = (v) => String(Math.round(v));

let ALL = [];
let days = 30;

/* ---------- 主题切换：跟随系统 -> 亮 -> 暗 ---------- */
const themeOrder = [null, "light", "dark"];
let themeIdx = 0;
$("theme-btn").onclick = () => {
  themeIdx = (themeIdx + 1) % 3;
  const t = themeOrder[themeIdx];
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  render();
};

/* ---------- 工具 ---------- */
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function div(cls, parent, text) {
  const e = document.createElement("div");
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const cssVar = (name) => getComputedStyle(document.body).getPropertyValue(name).trim();

function filtered() {
  if (days < 0) return ALL;
  const cutoff = new Date(); cutoff.setHours(0,0,0,0);
  if (days > 0) cutoff.setDate(cutoff.getDate() - (days - 1));
  const c = days === 0 ? new Date(new Date().toDateString()) : cutoff;
  return ALL.filter(r => new Date(r.ts) >= c);
}
const dayKey = (ts) => {
  const d = new Date(ts);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
};

/* ---------- 数据聚合 ---------- */
function aggregate(rows) {
  const kpi = { reqs: rows.length, ok: 0, tokens: 0, cost: 0, latSum: 0, latN: 0 };
  const byDay = new Map();          // day -> { model -> cost }
  const byModel = new Map();        // model -> {reqs,fails,in,out,cost,latSum,latN}
  for (const r of rows) {
    const m = r.model || "(未知)";
    if (r.status === "success") kpi.ok++;
    kpi.tokens += (r.total_tokens || 0);
    if (typeof r.cost_usd === "number") kpi.cost += r.cost_usd;
    if (typeof r.latency_ms === "number") { kpi.latSum += r.latency_ms; kpi.latN++; }

    const day = dayKey(r.ts);
    if (!byDay.has(day)) byDay.set(day, {});
    if (r.status === "success" && typeof r.cost_usd === "number") {
      const dm = byDay.get(day);
      dm[m] = (dm[m] || 0) + r.cost_usd;
    }
    let bm = byModel.get(m);
    if (!bm) { bm = {reqs:0, fails:0, in:0, out:0, cost:0, latSum:0, latN:0, missing:0}; byModel.set(m, bm); }
    bm.reqs++;
    if (r.status !== "success") bm.fails++;
    if (r.prompt_tokens == null) bm.missing++;
    else { bm.in += r.prompt_tokens; bm.out += r.completion_tokens || 0; }
    if (typeof r.cost_usd === "number") bm.cost += r.cost_usd;
    if (typeof r.latency_ms === "number") { bm.latSum += r.latency_ms; bm.latN++; }
  }
  return { kpi, byDay, byModel };
}

/* ---------- KPI ---------- */
function renderKpis(a) {
  const host = $("kpis"); host.textContent = "";
  const rate = a.kpi.reqs ? (100 * a.kpi.ok / a.kpi.reqs).toFixed(1) + "%" : "—";
  const avgLat = a.kpi.latN ? fmtInt(a.kpi.latSum / a.kpi.latN) + " ms" : "—";
  const tiles = [
    ["请求总数", fmtInt(a.kpi.reqs), a.kpi.reqs ? a.kpi.ok + " 成功" : "—"],
    ["成功率", rate, null],
    ["总 Tokens", fmtCompact(a.kpi.tokens), "输入 + 输出"],
    ["总费用", fmtMoney(a.kpi.cost), "代理侧核算"],
    ["平均延迟", avgLat, "成功请求"],
  ];
  for (const [label, value, note] of tiles) {
    const t = div("tile", host);
    div("label", t, label); div("value", t, value);
    if (note) div("note", t, note);
  }
}

/* ---------- 折线图：每日费用 ---------- */
function renderCostLine(a) {
  const host = $("cost-line"); host.textContent = "";
  $("cost-legend").textContent = "";
  const daysArr = [...a.byDay.keys()].sort();
  if (!daysArr.length) { div("empty", host, "暂无费用数据"); return; }

  // 系列取费用前 4 的模型，其余并入 Other（灰色）
  const totals = new Map();
  for (const dm of a.byDay.values())
    for (const [m, c] of Object.entries(dm)) totals.set(m, (totals.get(m) || 0) + c);
  const sorted = [...totals.entries()].sort((x, y) => y[1] - x[1]);
  const top = sorted.slice(0, 4).map(e => e[0]);
  const rest = sorted.slice(4).map(e => e[0]);
  const series = top.map(m => ({ name: m, color: cssVar("--s" + (top.indexOf(m) + 1)) }));
  if (rest.length) series.push({ name: "其他(" + rest.length + ")", color: cssVar("--other"), rest });

  const W = 480, H = 220, padL = 44, padR = 14, padT = 10, padB = 26;
  const iw = W - padL - padR, ih = H - padT - padB;
  const maxC = Math.max(1e-6, ...daysArr.map(d => {
    let s = 0; for (const srs of series) {
      const dm = a.byDay.get(d);
      s += srs.rest ? rest.reduce((acc, m) => acc + (dm[m] || 0), 0) : (dm[srs.name] || 0);
    } return s;
  }));
  const x = (i) => padL + (daysArr.length === 1 ? iw / 2 : i * iw / (daysArr.length - 1));
  const y = (v) => padT + ih - (v / maxC) * ih;

  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "display:block" }, null);
  host.appendChild(svg);

  // 网格 + Y 刻度（干净数字）
  const step = Math.pow(10, Math.floor(Math.log10(maxC))) / 2;
  const ticks = [];
  for (let v = 0; v <= maxC + 1e-12; v += step) ticks.push(v);
  for (const v of ticks) {
    el("line", { x1: padL, x2: W - padR, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }, svg);
    el("text", { x: padL - 6, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = "$" + fmtCompact(v);
  }
  el("line", { x1: padL, x2: W - padR, y1: y(0), y2: y(0), stroke: "var(--baseline)", "stroke-width": 1 }, svg);
  // X 刻度（首/中/尾）
  for (const i of [0, Math.floor((daysArr.length - 1) / 2), daysArr.length - 1]) {
    if (i > 0 && i < daysArr.length - 1 && new Set([0, daysArr.length - 1]).has(i)) continue;
    el("text", { x: x(i), y: H - 8, "text-anchor": i === 0 ? "start" : i === daysArr.length - 1 ? "end" : "middle" }, svg)
      .textContent = daysArr[i].slice(5);
  }

  // 线（2px，圆角连接）
  for (const srs of series) {
    const pts = daysArr.map((d, i) => {
      const dm = a.byDay.get(d);
      const v = srs.rest ? rest.reduce((acc, m) => acc + (dm[m] || 0), 0) : (dm[srs.name] || 0);
      return [x(i), y(v)];
    });
    el("polyline", {
      points: pts.map(p => p.join(",")).join(" "), fill: "none",
      stroke: srs.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round",
    }, svg);
    // 末端标记点（8px，2px surface 环）
    const [ex, ey] = pts[pts.length - 1];
    el("circle", { cx: ex, cy: ey, r: 4, fill: srs.color, stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
  }

  // 图例（>=2 系列必须存在）
  for (const srs of series) {
    const k = div("key", $("cost-legend"));
    const sw = document.createElement("span"); sw.className = "linekey"; sw.style.background = srs.color;
    k.appendChild(sw); k.appendChild(document.createTextNode(srs.name));
  }

  // 悬停：十字线 + 单一 tooltip 列出该日所有系列
  const cross = el("line", { y1: padT, y2: padT + ih, stroke: "var(--baseline)", "stroke-width": 1, visibility: "hidden" }, svg);
  const hoverDots = series.map(s => el("circle", { r: 4, fill: s.color, stroke: "var(--surface-1)", "stroke-width": 2, visibility: "hidden" }, svg));
  const tip = $("tooltip");
  const hit = el("rect", { x: padL, y: padT, width: iw, height: ih, fill: "transparent" }, svg);
  hit.addEventListener("pointermove", (ev) => {
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * (W / rect.width);
    let idx = 0, best = Infinity;
    for (let i = 0; i < daysArr.length; i++) { const d = Math.abs(x(i) - px); if (d < best) { best = d; idx = i; } }
    const d0 = daysArr[idx];
    cross.setAttribute("x1", x(idx)); cross.setAttribute("x2", x(idx)); cross.setAttribute("visibility", "visible");
    tip.textContent = "";
    div("tt-title", tip, d0);
    for (const srs of series) {
      const dm = a.byDay.get(d0) || {};
      const v = srs.rest ? rest.reduce((acc, m) => acc + (dm[m] || 0), 0) : (dm[srs.name] || 0);
      if (!v) continue;
      const row = div("tt-row", tip);
      const key = document.createElement("span"); key.className = "tt-key"; key.style.background = srs.color;
      row.appendChild(key);
      div("tt-val", row, fmtMoney(v)); div("tt-name", row, srs.name);
    }
    hoverDots.forEach((dot, i) => {
      const dm = a.byDay.get(d0) || {};
      const v = series[i].rest ? rest.reduce((acc, m) => acc + (dm[m] || 0), 0) : (dm[series[i].name] || 0);
      dot.setAttribute("cx", x(idx)); dot.setAttribute("cy", y(v));
      dot.setAttribute("visibility", v ? "visible" : "hidden");
    });
    tip.style.display = "block";
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 190) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
  });
  hit.addEventListener("pointerleave", () => {
    tip.style.display = "none"; cross.setAttribute("visibility", "hidden");
    hoverDots.forEach(d => d.setAttribute("visibility", "hidden"));
  });
}

/* ---------- 条形图：请求数按模型（单色系，数值在条端） ---------- */
function renderReqBars(a) {
  const host = $("req-bars"); host.textContent = "";
  const items = [...a.byModel.entries()].sort((x, y) => y[1].reqs - x[1].reqs);
  if (!items.length) { div("empty", host, "暂无请求数据"); return; }

  const W = 480, rowH = 30, padL = 8, padR = 64;
  const H = items.length * rowH + 8;
  const maxR = Math.max(...items.map(e => e[1].reqs));
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "display:block" }, null);
  host.appendChild(svg);
  const tip = $("tooltip");
  const barColor = cssVar("--accent");
  const trackColor = cssVar("--grid");

  items.forEach(([name, s], i) => {
    const cy = i * rowH + rowH / 2;
    const label = el("text", { x: padL, y: cy + 4, "text-anchor": "start", fill: "var(--text-secondary)", "font-size": 12 }, svg);
    label.textContent = name;
    const trackW = W - padL - 140 - padR;
    const bw = Math.max(2, (s.reqs / maxR) * trackW);
    const bx = padL + 140;
    // 底轨（同 ramp 浅一档）+ 数据条（<=24px 厚，数据端 4px 圆角，基线端方角）
    el("rect", { x: bx, y: cy - 10, width: trackW, height: 20, rx: 4, fill: trackColor, opacity: 0.45 }, svg);
    const bar = el("path", {
      d: `M${bx},${cy - 10} h${Math.max(0, bw - 4)} a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-${Math.max(0, bw - 4)} z`,
      fill: barColor,
    }, svg);
    // 数值在条端外侧（文字用文本色，不用系列色）
    const val = el("text", { x: bx + bw + 8, y: cy + 4, "text-anchor": "start", fill: "var(--text-primary)", "font-weight": 600 }, svg);
    val.textContent = fmtInt(s.reqs) + (s.fails ? ` · ${s.fails} 失败` : "");
    // 悬停：命中区域大于标记
    const hit = el("rect", { x: 0, y: i * rowH, width: W, height: rowH, fill: "transparent" }, svg);
    hit.addEventListener("pointermove", (ev) => {
      bar.setAttribute("opacity", "0.85");
      tip.textContent = "";
      div("tt-title", tip, name);
      const row = div("tt-row", tip);
      const key = document.createElement("span"); key.className = "tt-key"; key.style.background = barColor;
      row.appendChild(key);
      div("tt-val", row, fmtInt(s.reqs)); div("tt-name", row, "请求（" + s.fails + " 失败）");
      tip.style.display = "block";
      tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 190) + "px";
      tip.style.top = (ev.clientY + 14) + "px";
    });
    hit.addEventListener("pointerleave", () => { bar.setAttribute("opacity", "1"); tip.style.display = "none"; });
  });
}

/* ---------- 表格：按模型汇总 ---------- */
function renderTable(a) {
  const host = $("model-table"); host.textContent = "";
  const items = [...a.byModel.entries()].sort((x, y) => y[1].reqs - x[1].reqs);
  if (!items.length) { div("empty", host, "暂无数据"); return; }
  const tbl = document.createElement("table");
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  for (const [t, num] of [["模型", 0], ["请求", 1], ["失败", 1], ["输入 tok", 1], ["输出 tok", 1], ["费用", 1], ["平均延迟", 1], ["用量缺失", 1]]) {
    const th = document.createElement("th"); th.textContent = t;
    if (num) th.className = "num";
    trh.appendChild(th);
  }
  thead.appendChild(trh); tbl.appendChild(thead);
  const tbody = document.createElement("tbody");
  items.forEach(([name, s], idx) => {
    const tr = document.createElement("tr");
    const td0 = document.createElement("td");
    const dot = document.createElement("span"); dot.className = "swatch-dot";
    dot.style.background = idx < 4 ? cssVar("--s" + (idx + 1)) : cssVar("--other");
    td0.appendChild(dot); td0.appendChild(document.createTextNode(name));
    tr.appendChild(td0);
    const vals = [fmtInt(s.reqs), fmtInt(s.fails), fmtCompact(s.in), fmtCompact(s.out),
                  fmtMoney(s.cost), s.latN ? fmtInt(s.latSum / s.latN) + " ms" : "—",
                  s.missing ? fmtInt(s.missing) : "0"];
    for (const v of vals) { const td = document.createElement("td"); td.className = "num"; td.textContent = v; tr.appendChild(td); }
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody); host.appendChild(tbl);
}

/* ---------- 渲染 ---------- */
function render() {
  const a = aggregate(filtered());
  renderKpis(a);
  renderCostLine(a);
  renderReqBars(a);
  renderTable(a);
}

/* ---------- 登录与角色 ---------- */
let ME = null; // {user, role}

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ cache: "no-store" }, opts));
  if (res.status === 401) { showLogin(); throw new Error("请先登录"); }
  return res;
}

function showLogin() {
  ME = null;
  $("login-view").style.display = "flex";
  $("user-chip").style.display = "none";
  $("tab-users").style.display = "none";
  $("tab-settings").style.display = "none";
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}

function enterApp(me) {
  ME = me;
  $("login-view").style.display = "none";
  const chip = $("user-chip");
  chip.style.display = "";
  chip.textContent = "";
  const nameSpan = document.createElement("span");
  nameSpan.textContent = me.user;
  chip.appendChild(nameSpan);
  if (me.role === "admin") {
    const tag = document.createElement("span"); tag.className = "role-tag"; tag.textContent = "管理员";
    chip.appendChild(tag);
  }
  const logout = document.createElement("button"); logout.textContent = "退出";
  logout.onclick = async () => { try { await fetch("/api/logout", { method: "POST", body: "{}" }); } catch {} showLogin(); };
  chip.appendChild(logout);
  $("tab-users").style.display = me.role === "admin" ? "" : "none";
  $("tab-settings").style.display = me.role === "admin" ? "" : "none";
  showView("overview");
  load();
  applyRefresh();
}

$("login-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("login-err").textContent = "";
  try {
    const res = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("login-user").value.trim(), password: $("login-pass").value }),
    });
    const data = await res.json();
    if (!data.ok) { $("login-err").textContent = data.message || "登录失败"; return; }
    enterApp({ user: data.user, role: data.role });
  } catch (e) {
    $("login-err").textContent = "登录失败：" + e.message;
  }
});

/* ---------- 标签页切换 ---------- */
function showView(v) {
  const names = ["overview", "keys", "users", "settings"];
  for (const name of names) {
    const view = $("view-" + name);

}
$("tab-overview").onclick = () => showView("overview");
$("tab-keys").onclick = () => showView("keys");
$("tab-users").onclick = () => showView("users");
$("tab-settings").onclick = () => showView("settings");

/* ---------- Key 管理 ---------- */
const fmtDate = (iso) => {
  if (!iso) return null;
  const d = new Date(iso);
  return isNaN(d) ? null : (d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"));
};
const BUDGET_LABEL = { "30d": "每 30 天重置", "7d": "每 7 天重置", "14d": "每 14 天重置", "90d": "每 90 天重置" };
let KEY_MODELS = [];

function closeModal() { $("overlay").style.display = "none"; $("overlay").textContent = ""; }
function openModal(build) {
  const ov = $("overlay");
  ov.textContent = "";
  const m = div("modal", ov);
  build(m);
  ov.style.display = "flex";
  ov.onclick = (ev) => { if (ev.target === ov) closeModal(); };
}

async function loadKeys() {
  const host = $("key-list");
  try {
    const [keys, prices] = await Promise.all([
      api("/api/keys").then(r => r.json()),
      api("/api/prices").then(r => r.json()).catch(() => []),
    ]);
    KEY_MODELS = Array.isArray(prices) ? prices.map(p => p.model) : [];
    renderKeys(keys);
  } catch (e) {
    host.textContent = "";
    div("empty", host, "加载失败：" + e.message + "（代理未运行？）");
  }
}

function renderKeys(keys) {
  const host = $("key-list");
  host.textContent = "";
  if (!Array.isArray(keys)) { div("empty", host, keys.message || "加载失败"); return; }
  if (!keys.length) {
    div("empty", host, "还没有 Key，点上方「＋ 新建 Key」创建一个");
    return;
  }
  for (const k of keys) {
    const card = div("key-card", host);
    const top = div("k-top", card);
    div("k-name", top, k.alias || "(未命名)");
    const ok = k.status === "active" && !k.blocked;
    const st = document.createElement("span"); st.className = "state"; top.appendChild(st);
    const dot = document.createElement("span"); dot.className = "dot " + (ok ? "ok" : "bad"); st.appendChild(dot);
    st.appendChild(document.createTextNode(ok ? "正常" : "已停用"));

    if (k.mask) { const t = document.createElement("span"); t.className = "k-token"; t.textContent = k.mask; card.appendChild(t); }

    const meta = div("k-meta", card);
    // 花费 + 预算（用户最关心的放最上面）
    const budgetTxt = k.max_budget != null
      ? "已用 " + fmtMoney(k.spend) + " / 预算 " + fmtMoney(k.max_budget) + (BUDGET_LABEL[k.budget_duration] ? "（" + BUDGET_LABEL[k.budget_duration] + "）" : "")
      : "已用 " + fmtMoney(k.spend) + "（未设预算）";
    div(null, meta, budgetTxt);
    if (k.max_budget != null) {
      const meter = document.createElement("div"); meter.className = "meter"; meta.appendChild(meter);
      const pct = k.max_budget > 0 ? Math.min(100, 100 * k.spend / k.max_budget) : 0;
      const bar = document.createElement("i");
      bar.style.width = Math.max(2, pct) + "%";
      if (pct >= 100) bar.className = "over"; else if (pct >= 80) bar.className = "warn";
      meter.appendChild(bar);
    }
    div(null, meta, "可用模型：" + (k.models.length ? k.models.join("、") : "全部"));
    if (ME && ME.role === "admin" && k.user_id) div(null, meta, "归属：" + k.user_id);
    const created = fmtDate(k.created_at);
    const used = fmtDate(k.last_active);
    div(null, meta, "创建于 " + (created || "—") + " · " + (used ? "最近使用 " + used : "从未使用"));
    if (k.expires) div(null, meta, "到期：" + (fmtDate(k.expires) || k.expires));

    const foot = div("k-foot", card);
    const del = document.createElement("button");
    del.className = "danger"; del.textContent = "吊销";
    del.onclick = () => confirmRevoke(k);
    foot.appendChild(del);
  }
}

function confirmRevoke(k) {
  openModal((m) => {
    const h = document.createElement("h3"); h.textContent = "确定吊销「" + (k.alias || "未命名") + "」吗？"; m.appendChild(h);
    const p = document.createElement("p"); p.style.cssText = "font-size:13px;color:var(--text-secondary)";
    p.textContent = "吊销后，正在使用这个 Key 的程序会立即无法请求，且无法恢复。如只是想换新 Key，先新建再吊销旧的。";
    m.appendChild(p);
    const foot = div("m-foot", m);
    const cancel = document.createElement("button"); cancel.textContent = "先不吊销";
    cancel.onclick = closeModal;
    const yes = document.createElement("button"); yes.className = "danger"; yes.textContent = "确认吊销";
    yes.onclick = async () => {
      yes.disabled = true; yes.textContent = "吊销中…";
      try {
        const res = await api("/api/keys/delete", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ hash: k.hash }),
        });
        const data = await res.json();
        if (data.ok) { closeModal(); loadKeys(); }
        else { yes.disabled = false; yes.textContent = "确认吊销"; p.textContent = "失败：" + data.message; }
      } catch (e) { yes.disabled = false; yes.textContent = "确认吊销"; p.textContent = "失败：" + e.message; }
    };
    foot.appendChild(cancel); foot.appendChild(yes);
  });
}

$("btn-new-key").onclick = () => {
  openModal((m) => {
    const h = document.createElement("h3"); h.textContent = "新建 Key"; m.appendChild(h);

    const f1 = div("field", m);
    const l1 = document.createElement("label"); l1.textContent = "名称（给这个 Key 起个名字，方便辨认）"; f1.appendChild(l1);

    for (const mm of KEY_MODELS) {
      const o = document.createElement("option"); o.value = mm; o.textContent = mm; sel.appendChild(o);
    }

    for (const [v, t] of [["30d", "每 30 天重新计算（推荐）"], ["7d", "每 7 天"], ["90d", "每 90 天"], ["", "不重置（总额度用完即止）"]]) {
      const o = document.createElement("option"); o.value = v; o.textContent = t; cyc.appendChild(o);
    }
    f4.appendChild(cyc);

    const err = div("stale-note", m, "");
    err.style.color = "#d03b3b";

      if (!name.value.trim()) { err.textContent = "请先给 Key 起个名字"; return; }
      ok.disabled = true; ok.textContent = "创建中…"; err.textContent = "";
      try {
        const res = await api("/api/keys/create", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            alias: name.value.trim(),
            models: sel.value ? [sel.value] : [],
            max_budget: budget.value === "" ? null : budget.value,
            budget_duration: budget.value === "" ? null : cyc.value,
          }),
        });
        const data = await res.json();
        if (!data.ok) { ok.disabled = false; ok.textContent = "创建"; err.textContent = "创建失败：" + data.message; return; }
        showNewKey(data.key, name.value.trim());
      } catch (e) { ok.disabled = false; ok.textContent = "创建"; err.textContent = "创建失败：" + e.message; }
    };
    foot.appendChild(cancel); foot.appendChild(ok);
  });
};

function showNewKey(key, alias) {
  openModal((m) => {
    const h = document.createElement("h3"); h.textContent = "✅ 已创建「" + alias + "」"; m.appendChild(h);
    const p = document.createElement("p"); p.style.cssText = "font-size:13px;color:var(--text-secondary)";
    p.textContent = "这就是你的新 Key，复制保存好："; m.appendChild(p);
    const box = div("newkey-box", m, key);
    const wb = div("warn-box", m, "⚠️ 为了安全，这个 Key 只显示这一次，关掉窗口就再也看不到完整内容了（列表里只显示结尾几位）。请现在就复制保存。");
    const foot = div("m-foot", m);
    const copy = document.createElement("button"); copy.textContent = "复制";
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(key); copy.textContent = "已复制 ✓"; }
      catch { box.select && document.execCommand("copy"); copy.textContent = "已复制 ✓"; }
    };
    const done = document.createElement("button"); done.className = "primary"; done.textContent = "我已保存，关闭";
    done.onclick = () => { closeModal(); loadKeys(); };
    foot.appendChild(copy); foot.appendChild(done);
  });
}

/* ---------- 刷新间隔（localStorage 持久化） ---------- */
let refreshSec = parseInt(localStorage.getItem("refresh-sec") || "30", 10);
let refreshTimer = null;
$("refresh-interval").value = String(refreshSec);
$("refresh-interval").onchange = () => {
  refreshSec = parseInt($("refresh-interval").value, 10);
  localStorage.setItem("refresh-sec", String(refreshSec));
  applyRefresh();
};
function applyRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = null;
  if (refreshSec > 0) refreshTimer = setInterval(load, refreshSec * 1000);
}

/* ---------- 设置页：服务状态 + 计费单价 ---------- */
let PRICES = [];
const KEY_LABEL = { openai_key: "OpenAI API Key", deepseek_key: "DeepSeek API Key" };

async function loadSettings() {
  try {
    const [st, pr] = await Promise.all([
      api("/api/status").then(r => r.json()),
      fetch("/api/prices", { cache: "no-store" }).then(r => r.json()),
    ]);
    PRICES = pr;
    renderStatus(st);
    renderPrices();
  } catch (e) {
    div("empty", $("svc-status"), "设置加载失败：" + e.message);
  }
}

function renderStatus(st) {
  const host = $("svc-status"); host.textContent = "";
  const items = [
    ["代理服务 (127.0.0.1:5555)", st.proxy_running, st.proxy_running ? "运行中" : "未运行，请执行 scripts\\start.ps1"],
    [KEY_LABEL.openai_key, st.openai_key, st.openai_key ? "已配置" : "未配置，请在 .env 填写 OPENAI_API_KEY"],
    [KEY_LABEL.deepseek_key, st.deepseek_key, st.deepseek_key ? "已配置" : "未配置，请在 .env 填写 DEEPSEEK_API_KEY"],
  ];
  for (const [name, ok, hint] of items) {
    const it = div("status-item", host);
    const dot = document.createElement("span"); dot.className = "dot " + (ok ? "ok" : "bad");
    it.appendChild(dot);
    div(null, it, name);
    div("hint", it, hint);
  }
}

function renderPrices() {
  const host = $("price-table"); host.textContent = "";
  if (!PRICES.length) { div("empty", host, "config.yaml 中未解析到模型部署"); return; }
  const tbl = document.createElement("table");
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  for (const [t, num] of [["别名", 0], ["上游模型", 0], ["输入 $/1M", 1], ["输出 $/1M", 1]]) {
    const th = document.createElement("th"); th.textContent = t;
    if (num) th.className = "num";
    trh.appendChild(th);
  }
  thead.appendChild(trh); tbl.appendChild(thead);
  const tbody = document.createElement("tbody");
  PRICES.forEach((p, i) => {
    const tr = document.createElement("tr");
    const td0 = document.createElement("td"); td0.textContent = p.model; tr.appendChild(td0);
    const td1 = document.createElement("td"); td1.textContent = p.upstream || "?"; tr.appendChild(td1);
    for (const key of ["in", "out"]) {
      const td = document.createElement("td"); td.className = "num";
      const inp = document.createElement("input");
      inp.type = "number"; inp.step = "0.000001"; inp.min = "0";
      inp.value = p[key] == null ? "" : p[key];
      inp.dataset.idx = i; inp.dataset.key = key;
      if (p[key] == null) inp.placeholder = "未设置";
      td.appendChild(inp); tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody); host.appendChild(tbl);
}

$("save-prices").onclick = async () => {
  const msg = $("price-msg");
  const prices = [];
  for (const inp of $("price-table").querySelectorAll("input")) {
    const p = PRICES[+inp.dataset.idx];
    const v = parseFloat(inp.value);
    if (isNaN(v) || v < 0) { msg.textContent = "请为所有部署填写有效的非负单价"; return; }
    prices.push({ model: p.model, upstream: p.upstream, in_per_m: inp.dataset.key === "in" ? v : undefined, out_per_m: inp.dataset.key === "out" ? v : undefined });
  }
  // 同一部署的 in/out 合并为一条
  const merged = new Map();
  for (const p of prices) {
    const k = p.model + "|" + p.upstream;
    const cur = merged.get(k) || { model: p.model, upstream: p.upstream };
    if (p.in_per_m !== undefined) cur.in_per_m = p.in_per_m;
    if (p.out_per_m !== undefined) cur.out_per_m = p.out_per_m;
    merged.set(k, cur);
  }
  try {
    const res = await api("/api/prices", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prices: [...merged.values()] }),
    });
    const data = await res.json();
    msg.textContent = data.message || (data.ok ? "已保存" : "保存失败");
    if (data.ok) PRICES = await api("/api/prices").then(r => r.json());
  } catch (e) {
    msg.textContent = "保存失败：" + e.message;
  }
};

$("restart-proxy").onclick = async () => {
  const msg = $("price-msg");
  msg.textContent = "正在重启代理…";
  try {
    const res = await api("/api/restart-proxy", { method: "POST", body: "{}" });
    const data = await res.json();
    msg.textContent = data.message;
    loadSettings();
  } catch (e) {
    msg.textContent = "重启失败：" + e.message;
  }
};

/* ---------- 用户管理（仅管理员） ---------- */
async function loadUsers() {
  const host = $("user-table");
  try {
    const users = await api("/api/users").then(r => r.json());
    renderUsers(users);
  } catch (e) {
    host.textContent = "";
    div("empty", host, "加载失败：" + e.message);
  }
}

function renderUsers(users) {
  const host = $("user-table");
  host.textContent = "";
  if (!Array.isArray(users)) { div("empty", host, users.message || "加载失败"); return; }
  if (!users.length) { div("empty", host, "还没有用户，点上方「＋ 新建用户」创建"); return; }
  const tbl = document.createElement("table");
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  for (const t of ["用户名", "已花费", "预算上限", "创建时间", "操作"]) {
    const th = document.createElement("th"); th.textContent = t; trh.appendChild(th);
  }
  thead.appendChild(trh); tbl.appendChild(thead);
  const tbody = document.createElement("tbody");
  for (const u of users) {
    const tr = document.createElement("tr");
    const td0 = document.createElement("td"); td0.textContent = u.user_id; tr.appendChild(td0);
    const td1 = document.createElement("td"); td1.className = "num"; td1.textContent = fmtMoney(u.spend); tr.appendChild(td1);
    const td2 = document.createElement("td"); td2.className = "num";
    td2.textContent = u.max_budget != null ? fmtMoney(u.max_budget) : "不限"; tr.appendChild(td2);
    const td3 = document.createElement("td"); td3.textContent = fmtDate(u.created_at) || "—"; tr.appendChild(td3);
    const td4 = document.createElement("td");
    const reset = document.createElement("button"); reset.textContent = "重置密码";
    reset.style.cssText = "border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;margin-right:6px";
    reset.onclick = () => resetUserPwd(u.user_id);
    const del = document.createElement("button"); del.textContent = "删除";
    del.style.cssText = "border:1px solid color-mix(in srgb,#d03b3b 40%,transparent);background:var(--surface-1);color:#d03b3b;border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer";
    del.onclick = () => confirmDeleteUser(u);
    td4.appendChild(reset); td4.appendChild(del); tr.appendChild(td4);
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody); host.appendChild(tbl);
}

$("btn-new-user").onclick = () => {
  openModal((m) => {
    const h = document.createElement("h3"); h.textContent = "新建用户"; m.appendChild(h);
    const f1 = div("field", m);
    const l1 = document.createElement("label"); l1.textContent = "用户名（登录用）"; f1.appendChild(l1);
    const uid = document.createElement("input"); uid.placeholder = "例如：xiaoming"; f1.appendChild(uid);
    div("hint", f1, "只能用 2-32 位字母、数字、点、下划线、短横线。");
    const f2 = div("field", m);
    const l2 = document.createElement("label"); l2.textContent = "初始密码（至少 6 位）"; f2.appendChild(l2);
    const pwd = document.createElement("input"); pwd.type = "text"; pwd.placeholder = "请告知用户本人，登录后可改（暂由管理员重置）"; f2.appendChild(pwd);
    const f3 = div("field", m);
    const l3 = document.createElement("label"); l3.textContent = "总花费上限（美元，可不填）"; f3.appendChild(l3);
    const bud = document.createElement("input"); bud.type = "number"; bud.min = "0"; bud.step = "0.01"; bud.placeholder = "不填 = 不限制"; f3.appendChild(bud);
    const err = div("stale-note", m, ""); err.style.color = "#d03b3b";
    const foot = div("m-foot", m);
    const cancel = document.createElement("button"); cancel.textContent = "取消"; cancel.onclick = closeModal;
    const ok = document.createElement("button"); ok.className = "primary"; ok.textContent = "创建";
    ok.onclick = async () => {
      ok.disabled = true; ok.textContent = "创建中…"; err.textContent = "";
      try {
        const res = await api("/api/users/create", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: uid.value.trim(), password: pwd.value, max_budget: bud.value === "" ? null : bud.value }),
        });
        const data = await res.json();
        if (!data.ok) { ok.disabled = false; ok.textContent = "创建"; err.textContent = data.message; return; }
        closeModal(); loadUsers();
      } catch (e) { ok.disabled = false; ok.textContent = "创建"; err.textContent = e.message; }
    };
    foot.appendChild(cancel); foot.appendChild(ok);
  });
};

function resetUserPwd(userId) {
  openModal((m) => {
    const h = document.createElement("h3"); h.textContent = "重置「" + userId + "」的密码"; m.appendChild(h);
    const f = div("field", m);
    const l = document.createElement("label"); l.textContent = "新密码（至少 6 位）"; f.appendChild(l);
    const pwd = document.createElement("input"); pwd.type = "text"; f.appendChild(pwd);
    const err = div("stale-note", m, ""); err.style.color = "#d03b3b";
    const foot = div("m-foot", m);
    const cancel = document.createElement("button"); cancel.textContent = "取消"; cancel.onclick = closeModal;
    const ok = document.createElement("button"); ok.className = "primary"; ok.textContent = "重置";
    ok.onclick = async () => {
      try {
        const res = await api("/api/users/reset-password", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, password: pwd.value }),
        });
        const data = await res.json();
        if (!data.ok) { err.textContent = data.message; return; }
        closeModal(); loadUsers();
      } catch (e) { err.textContent = e.message; }
    };
    foot.appendChild(cancel); foot.appendChild(ok);
  });
}

function confirmDeleteUser(u) {
  openModal((m) => {
    const h = document.createElement("h3"); h.textContent = "删除用户「" + u.user_id + "」？"; m.appendChild(h);
    const p = document.createElement("p"); p.style.cssText = "font-size:13px;color:var(--text-secondary)";
    p.textContent = "该用户名下所有 Key 会一并失效，已花费 " + fmtMoney(u.spend) + "。此操作不可恢复。";
    m.appendChild(p);
    const foot = div("m-foot", m);
    const cancel = document.createElement("button"); cancel.textContent = "取消"; cancel.onclick = closeModal;
    const yes = document.createElement("button"); yes.className = "danger"; yes.textContent = "确认删除";
    yes.onclick = async () => {
      try {
        const res = await api("/api/users/delete", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: u.user_id }),
        });
        const data = await res.json();
        if (data.ok) { closeModal(); loadUsers(); }
        else { p.textContent = "失败：" + data.message; }
      } catch (e) { p.textContent = "失败：" + e.message; }
    };
    foot.appendChild(cancel); foot.appendChild(yes);
  });
}

/* ---------- 启动：检查登录态 ---------- */
(async () => {
  try {
    const me = await fetch("/api/me", { cache: "no-store" }).then(r => r.json());
    if (me.logged_in) enterApp({ user: me.user, role: me.role });
    else showLogin();
  } catch {
    showLogin();
  }
})();
